# .github/workflows/playwright.yml

name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # Step 1 - Get your code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 - Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step 3 - Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4 - Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # Step 5 - Run tests!
      - name: Run Playwright tests
        run: npx playwright test
          --ignore=tests/Autosuggestdropdown.spec.js
          --ignore=tests/Assertions.spec.js
          --ignore=tests/Builtinlocators.spec.js
          --ignore=tests/apitest.spec.js
          --ignore=tests/Datepicker.spec.js
          --ignore=tests/Hooks1.spec.js
          --ignore=tests/Hooks3.spec.js
          --ignore=tests/Login.spec.js
          --ignore=tests/Login1.spec.js
          --ignore=tests/Reporters.spec.js
          --ignore=tests/Softassertions.spec.js
          --ignore=tests/test-1.spec.ts
          --ignore=tests/test-2.spec.ts
          --ignore=tests/Videos.spec.js
          --reporter=list,html

      # Step 6 - Upload test report
      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30